<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Anchor + helm mark in wave blue -->
  <!-- Ring at top -->
  <circle cx="50" cy="12" r="7" fill="none" stroke="#1E8FCA" stroke-width="5"/>
  <!-- Vertical shaft -->
  <line x1="50" y1="19" x2="50" y2="88" stroke="#1E8FCA" stroke-width="7" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="28" y1="34" x2="72" y2="34" stroke="#1E8FCA" stroke-width="6" stroke-linecap="round"/>
  <!-- Crossbar rings -->
  <circle cx="28" cy="34" r="4" fill="none" stroke="#1E8FCA" stroke-width="4"/>
  <circle cx="72" cy="34" r="4" fill="none" stroke="#1E8FCA" stroke-width="4"/>
  <!-- Helm wheel center -->
  <circle cx="50" cy="55" r="12" fill="none" stroke="#2BBFF0" stroke-width="4"/>
  <circle cx="50" cy="55" r="3" fill="#2BBFF0"/>
  <!-- Helm spokes -->
  <line x1="50" y1="43" x2="50" y2="67" stroke="#2BBFF0" stroke-width="3"/>
  <line x1="38" y1="51" x2="62" y2="59" stroke="#2BBFF0" stroke-width="3"/>
  <line x1="38" y1="59" x2="62" y2="51" stroke="#2BBFF0" stroke-width="3"/>
  <!-- Anchor flukes -->
  <path d="M50 88 L30 80 L35 75 L50 82 L65 75 L70 80 Z" fill="#1E8FCA"/>
  <!-- Crown bar -->
  <line x1="33" y1="80" x2="67" y2="80" stroke="#1E8FCA" stroke-width="5" stroke-linecap="round"/>
</svg>
